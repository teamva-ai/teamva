name: Release

on:
  # Pushing a version tag builds and publishes every platform without a manual run.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.4.0（会创建 v0.4.0 标签）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      keep_draft:
        description: "只构建并上传，保持草稿不公开"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            PRERELEASE="false"
            case "$TAG" in *-*) PRERELEASE="true" ;; esac
          else
            VERSION="${INPUT_VERSION#v}"
            TAG="v$VERSION"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          fi
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "::error::版本号无效：$TAG"
            exit 1
          fi
          # A tag push already created the tag; only manual runs need the check.
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::标签 $TAG 已存在"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # The draft keeps partial builds invisible on the Releases page and
      # download links until every platform and the merged checksums are up.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.validate.outputs.tag }}
          VERSION: ${{ steps.validate.outputs.version }}
          PRERELEASE: ${{ steps.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

          cat > /tmp/release-notes.md <<'NOTES'
          # Teamva <VERSION>

          ## 下载 / Downloads

          - macOS Apple Silicon: `teamva-desktop-darwin-arm64.dmg`
          - macOS Intel: `teamva-desktop-darwin-x64.dmg`
          - Windows x64: `Teamva-<VERSION>-windows-x64.zip`
          - Linux x86_64: `Teamva-<VERSION>-linux-x86_64.AppImage`
          - Linux arm64: `Teamva-<VERSION>-linux-arm64.AppImage`
          - 校验和 / Checksums: `sha256.txt`

          ## 安装 / Install

          ### macOS

          打开 DMG，把 Teamva 拖进“应用程序”。应用使用 ad-hoc 签名、未使用 Apple Developer ID 签名，也未公证，首次打开会被 Gatekeeper 拦截：
          右键应用选择“打开”，或执行下面的命令放行一次。

          ```bash
          sudo /usr/bin/xattr -rd com.apple.quarantine "/Applications/Teamva.app"
          ```

          ### Windows

          解压后运行 `Teamva.exe`。程序未签名，SmartScreen 会提示“Windows 已保护你的电脑”：
          点击“更多信息”→“仍要运行”。当前 Windows 版暂不提供 Git 变更面板。

          ### Linux

          ```bash
          chmod +x Teamva-<VERSION>-linux-*.AppImage
          ./Teamva-<VERSION>-linux-*.AppImage
          ```

          AppImage 需要 `libwebkit2gtk-4.1` 与 `libfuse2`（Ubuntu 24.04+ 为 `libfuse2t64`）。
          没有 FUSE 时可改用 `--appimage-extract-and-run` 运行。

          ---

          Builds are produced by GitHub Actions from this repository. macOS builds are
          ad-hoc signed but not Developer ID signed or notarized; other artifacts are
          unsigned. Verify the SHA-256 value in `sha256.txt` before running them.
          NOTES
          sed -i "s/<VERSION>/${VERSION}/g" /tmp/release-notes.md

          args=(--draft --title "$TAG" --notes-file /tmp/release-notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  desktop:
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The build script produces separate arm64 and x64 DMG/ZIP pairs.
          - runner: macos-latest
            platform: mac
            arch: split
          - runner: ubuntu-latest
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-latest
            platform: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build macOS app and DMG
        if: matrix.platform == 'mac'
        env:
          TEAMVA_VERSION: ${{ needs.release.outputs.version }}
          TEAMVA_OUTPUT_DIR: ${{ github.workspace }}/dist/release
        run: ./scripts/release/build-desktop.sh

      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        env:
          TEAMVA_VERSION: ${{ needs.release.outputs.version }}
        run: ./scripts/release/build-linux.sh ${{ matrix.arch }} "$GITHUB_WORKSPACE/dist/release"

      - name: Build Windows package
        if: matrix.platform == 'windows'
        shell: bash
        env:
          TEAMVA_VERSION: ${{ needs.release.outputs.version }}
        run: bash ./scripts/release/build-windows.sh amd64 "$GITHUB_WORKSPACE/dist/release"

      - name: Upload installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$PLATFORM" = "mac" ]; then
            files=(dist/release/*.dmg dist/release/*.zip)
          elif [ "$PLATFORM" = "windows" ]; then
            files=(dist/release/*windows-x64.zip)
          else
            files=(dist/release/*.AppImage)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no $PLATFORM installers were produced"
            exit 1
          fi
          # Release uploads occasionally fail on runner network hiccups; --clobber
          # makes a retry safe.
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --clobber; then
              exit 0
            fi
            echo "::warning::upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::upload failed after 3 attempts"
          exit 1

      - name: Write checksum fragment
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist/checksums
          fragment="dist/checksums/sha256-${PLATFORM}-${ARCH}.txt"
          if [ "$PLATFORM" = "mac" ]; then
            (cd dist/release && shasum -a 256 \
              teamva-desktop-darwin-arm64.dmg teamva-desktop-darwin-arm64.zip \
              teamva-desktop-darwin-x64.dmg teamva-desktop-darwin-x64.zip) > "$fragment"
          else
            cp dist/release/sha256.txt "$fragment"
          fi
          cat "$fragment"

      - uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/checksums/sha256-${{ matrix.platform }}-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

  checksums:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          merge-multiple: true
          path: release-checksums

      - name: Merge checksum fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(release-checksums/*.txt)
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "::error::no checksum fragments were produced"
            exit 1
          fi
          cat "${fragments[@]}" | LC_ALL=C sort -k 2 > sha256.txt
          duplicated="$(awk '{ print $2 }' sha256.txt | uniq -d)"
          if [ -n "$duplicated" ]; then
            echo "::error::duplicate checksum entries for: $duplicated"
            exit 1
          fi
          # Every platform must appear in the manifest before it goes public.
          for pattern in \
            '^[0-9a-f]{64}  teamva-desktop-darwin-arm64\.dmg$' \
            '^[0-9a-f]{64}  teamva-desktop-darwin-arm64\.zip$' \
            '^[0-9a-f]{64}  teamva-desktop-darwin-x64\.dmg$' \
            '^[0-9a-f]{64}  teamva-desktop-darwin-x64\.zip$' \
            '^[0-9a-f]{64}  Teamva-[^ ]+-windows-x64\.zip$' \
            '^[0-9a-f]{64}  Teamva-[^ ]+-linux-x86_64\.AppImage$' \
            '^[0-9a-f]{64}  Teamva-[^ ]+-linux-arm64\.AppImage$'; do
            if ! grep -Eq "$pattern" sha256.txt; then
              echo "::error::sha256.txt is missing an entry matching $pattern"
              exit 1
            fi
          done
          cat sha256.txt

      - name: Upload merged checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh release upload "$TAG" sha256.txt --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "::warning::upload failed (attempt $attempt/3), retrying in 10s"
            sleep 10
          done
          echo "::error::upload failed after 3 attempts"
          exit 1

  # Any failed platform keeps the release as a draft so a partial download set
  # never appears under Releases or the website.
  publish:
    needs: [release, desktop, checksums]
    if: ${{ always() && inputs.keep_draft != true && needs.release.result == 'success' && needs.desktop.result == 'success' && needs.checksums.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft=false --repo "$GITHUB_REPOSITORY")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release edit "$TAG" "${args[@]}"
