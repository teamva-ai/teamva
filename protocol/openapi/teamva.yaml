      properties:
        seen:
          type: array
          uniqueItems: true
          maxItems: 7
          description: 按 overview、issues、conversations、resources、memories、schedules、changes 的固定顺序返回；未看过时是空数组而非 null
          items: {$ref: "#/components/schemas/FeatureTourID"}
    Onboarding:
      type: object
      additionalProperties: false
      required: [dismissed, needed]
      properties:
        dismissed: {type: boolean, description: 已跳过或已完成引导；只持久化这一项}
        needed: {type: boolean, description: 推导值：未跳过且没有用户 Agent 且 Lumi 未配置时为 true}

    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [computer_id, name]
      properties:
        computer_id: {type: string}
        name: {type: string, minLength: 1}
        description: {type: string}
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        description: {type: string}
    ProjectResourceRequest:
      type: object
      additionalProperties: false
      required: [kind]
      allOf:
        - if:
            properties:
              kind: {const: url}
          then:
            required: [url]
            properties:
              url: {type: string, format: uri}
          else:
            required: [name, path]
            properties:
              name: {type: string, minLength: 1, pattern: '\S'}
              path: {type: string}
      properties:
        kind: {type: string, enum: [code_directory, document_directory, url]}
        name:
          type: string
          description: 手填时去除首尾空白并保留内容，最多 200 个 Unicode 字符。目录资源必须填写；网址资源可省略、留空或仅填空白，此时在项目所有权验证后尽力读取 HTML title，规范化实体及空白并截断为 200 字符。读取失败或安全策略禁止出站时使用去掉 query、fragment 的网址（同样截断），不阻断创建；不会异步覆盖手填名称。
        path: {type: string, description: 本地目录的绝对路径}
        url: {type: string, format: uri, description: 不含用户凭据的 HTTP(S) 地址。内网网址可注册但不自动读取名称；资源地址保留原始 query 和 fragment。}
    UpdateResourceRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        name: {type: string}
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [agent_service_id, name]
      properties:
        agent_service_id: {type: string, description: 本机探测的 AgentService}
        model: {type: string, description: 固定模型（来自服务能力列表）}
        name: {type: string, minLength: 1}
        note: {type: string}
        system_prompt: {type: string}
        skill_version_ids: {type: array, items: {type: string}, description: 绑定的 Skill Package 版本}
    InstallComputerSkillPackageRequest:
      type: object
      additionalProperties: false
      required: [skill_package_id]
      properties:
        skill_package_id: {type: string, minLength: 1}
    UpdateAgentRequest:
