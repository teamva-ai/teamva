      required: [detached, unborn, ahead, behind]
      properties:
        name: {type: string}
        oid: {type: string}
        detached: {type: boolean}
        unborn: {type: boolean}
        upstream: {type: string}
        ahead: {type: integer}
        behind: {type: integer}
    GitRepositorySummary:
      type: object
      additionalProperties: false
      required: [id, common_id, label, root_display, resource_ids, discovery_origin, worktree_kind, worktree, scope, branch, operation, generation, state, counts, warnings]
      properties:
        id: {type: string, description: 基于 canonical repository identity 的稳定 SHA-256 身份，不暴露路径}
        common_id: {type: string, description: 共享 Git common directory 的稳定 SHA-256 身份}
        label: {type: string, description: 安全数据 label；不拼接本地化 scope/suffix，UI 根据 scope 本地化}
        root_display: {type: string, description: 安全显示路径；绝不包含本机绝对路径，也不拼接本地化 scope/suffix}
        resource_ids: {type: array, items: {type: string}}
        discovery_origin: {type: string, enum: [resource, nested, ancestor]}
        origin: {type: string}
        worktree_kind: {type: string, enum: [main, linked, submodule]}
        worktree:
          type: object
          required: [linked, main]
          properties:
            linked: {type: boolean}
            main: {type: boolean}
        scope:
          type: string
          enum: [full, resource_prefix]
          description: full 授权完整仓库根；resource_prefix 仅授权已注册资源的精确根，可由 Provider 安全读写
        branch: {$ref: "#/components/schemas/GitRepositoryBranch"}
        operation:
          type: object
          properties:
            kind: {type: string}
        generation: {type: integer, format: int64}
        state: {type: string, enum: [unknown, clean, dirty, conflicted, unavailable]}
        counts:
          type: object
          required: [conflict, staged, unstaged, untracked]
          properties:
            conflict: {type: integer, minimum: 0}
            staged: {type: integer, minimum: 0}
            unstaged: {type: integer, minimum: 0}
            untracked: {type: integer, minimum: 0}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/GitRepositoryWarning"}
    GitRepositoryList:
      type: object
      additionalProperties: false
      required: [snapshot_id, repositories, truncated, warnings]
      properties:
        snapshot_id: {type: string, description: Runtime 实例内 HMAC 快照身份，不可跨实例复用}
        repositories: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/GitRepositorySummary"}}
