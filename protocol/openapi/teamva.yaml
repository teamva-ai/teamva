            - {type: "null"}
        submodule:
          anyOf:
            - {$ref: "#/components/schemas/GitSubmodule"}
            - {type: "null"}
        diff_available: {type: boolean}
        additions: {type: integer, minimum: 0}
        deletions: {type: integer, minimum: 0}
        stats: {$ref: "#/components/schemas/GitDiffStats"}
    GitChangesPage:
      type: object
      additionalProperties: false
      required: [snapshot_id, repository_id, repository_generation, generation, items, truncated, warnings]
      properties:
        snapshot_id: {type: string}
        repository_id: {type: string}
        repository_generation: {type: integer, format: int64}
        generation: {type: integer, format: int64}
        area: {type: string, enum: [conflict, staged, unstaged, untracked]}
        items: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/GitChange"}}
        next_cursor: {type: string}
        truncated: {type: boolean}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/GitRepositoryWarning"}
    GitChangesPageEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/GitChangesPage"}
    GitDiffTruncation:
      type: object
      additionalProperties: false
      required: [truncated, reason]
      properties:
        truncated: {type: boolean}
        reason:
          type: string
          description: 稳定截断代码；UI 必须按代码本地化
          enum: [patch_limit, timeout, response_budget]
        limit_bytes: {type: integer, format: int64, minimum: 0}
    GitDiffImage:
      type: object
      additionalProperties: false
      required: [mime_type, data_url, size_bytes]
      properties:
        mime_type: {type: string}
        data_url: {type: string}
        size_bytes: {type: integer, format: int64, minimum: 0}
    GitDiffImages:
      type: object
      additionalProperties: false
      properties:
        before: {$ref: "#/components/schemas/GitDiffImage"}
        after: {$ref: "#/components/schemas/GitDiffImage"}
    GitDiffResult:
      type: object
      additionalProperties: false
      required: [snapshot_id, repository_id, change_id, generation, comparison, kind, path, stats, truncated, confirm_required]
      properties:
        snapshot_id: {type: string}
        repository_id: {type: string}
        change_id: {type: string}
        generation: {type: integer, format: int64}
        comparison: {type: string}
        kind: {type: string}
        path: {$ref: "#/components/schemas/GitDisplayPath"}
        old_path:
          anyOf:
            - {$ref: "#/components/schemas/GitDisplayPath"}
            - {type: "null"}
        language: {type: string}
        stats: {$ref: "#/components/schemas/GitDiffStats"}
        patch: {type: string}
        truncated: {type: boolean}
        truncation:
          anyOf:
            - {$ref: "#/components/schemas/GitDiffTruncation"}
            - {type: "null"}
        confirm_required: {type: boolean}
        message_code:
          type: string
          description: v5 可选稳定消息代码；存在时 UI 必须按此字段本地化，message 仅为英文 fallback
          enum:
            - untracked_directory_expand_required
            - untracked_symlink_summary
            - diff_confirmation_required
            - diff_line_confirmation_required
            - diff_patch_limit
            - diff_timeout
            - image_confirmation_required
            - response_budget
        message: {type: string, description: 不含本机路径的安全英文 fallback；UI 应优先使用 message_code}
        images:
          anyOf:
            - {$ref: "#/components/schemas/GitDiffImages"}
            - {type: "null"}
    GitDiffResultEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/GitDiffResult"}
    GitRunPatchArea:
      type: object
      additionalProperties: false
      required: [area, paths, binary_paths, truncated]
      properties:
        area: {type: string, enum: [conflict, staged, unstaged]}
        patch:
          type: string
          description: 仓库相对路径的 aggregate unified patch；二进制只含 Git 元数据，不含 binary patch body
          maxLength: 8388608
        paths: {type: array, maxItems: 10000, items: {type: string, maxLength: 4096}}
        binary_paths: {type: array, maxItems: 10000, items: {type: string, maxLength: 4096}}
        truncated: {type: boolean}
    GitRunUntrackedEntry:
      type: object
      additionalProperties: false
      required: [path, kind]
      properties:
        path: {type: string, maxLength: 4096, description: 安全仓库相对显示路径}
        kind: {type: string, enum: [file, symlink, directory, submodule]}
        size_bytes: {type: integer, format: int64, minimum: 0}
    GitRunWorkspaceSnapshot:
      type: object
      additionalProperties: false
      required: [repository_id, label, root_display, phase, captured_at, areas, untracked, warnings, truncated, content_hash]
      description: Git 工作区在 Run 边界的观察；不是 Agent 独占修改证明
      properties:
        repository_id: {type: string, description: 稳定不可逆仓库 ID}
        label: {type: string}
        root_display: {type: string, description: 安全 label/相对显示，永不包含仓库绝对路径}
        phase: {type: string, enum: [start, end]}
        captured_at: {type: string, format: date-time}
        areas: {type: array, items: {$ref: "#/components/schemas/GitRunPatchArea"}}
        untracked: {type: array, maxItems: 10000, items: {$ref: "#/components/schemas/GitRunUntrackedEntry"}}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/GitRepositoryWarning"}
        truncated: {type: boolean}
        content_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
    GitProviderChangeReport:
      type: object
      additionalProperties: false
      required: [id, seq, occurred_at, source, paths, paths_verified, scope, truncated]
      description: Provider 明确报告的文件变化；UI 必须标为 Agent 报告
      properties:
        id: {type: string}
        seq: {type: integer, format: int64, minimum: 1}
        occurred_at: {type: string, format: date-time}
        source: {type: string, description: '标准事件类型或 Provider 自己声明的原生变更来源。'}
        provider_turn_id: {type: string, maxLength: 256}
        patch: {type: string, maxLength: 8388608}
        paths: {type: array, maxItems: 10000, items: {type: string, maxLength: 4096}}
        paths_verified:
          type: boolean
          description: true 仅表示本报告返回的路径全部通过安全仓库相对路径校验
        scope:
          type: string
          enum: [repository, unverified]
          description: unverified 路径只能显示，绝不能归入 Run 仓库或参与文件操作
        status: {type: string, maxLength: 256}
        truncated: {type: boolean}
    GitRunChangesResult:
      type: object
      additionalProperties: false
      required: [run_id, snapshots, provider_reports, provider_reports_truncated]
      properties:
        run_id: {type: string}
        snapshots:
          type: array
          maxItems: 200
          description: 项目工作区中每个已发现仓库的 start/end 观察；总响应仍受统一字节和路径预算约束
          items: {$ref: "#/components/schemas/GitRunWorkspaceSnapshot"}
        provider_reports: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/GitProviderChangeReport"}}
        provider_reports_truncated:
          type: boolean
          description: 达到报告、整个响应字节预算或 5000 个扫描事件上限时为 true
        next_provider_cursor:
          type: string
          description: 截断时已安全扫描到的十进制 Run event sequence；可能跨过不产生报告的事件，客户端应原样用于下一页
    GitRunChangesEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/GitRunChangesResult"}

    Appearance:
      type: object
      additionalProperties: false
      required: [palette]
      properties:
        palette:
          type: string
          enum: [default, hallmark, chamber, flexoki, ocean, forest, iris]
          default: default
          description: 全局配色；default 为默认主题，提供浅色纯白背景与黑色强调及对应深色版本。已存储的旧 project 值只读投影为 default，不改写元数据或版本；请求不接受 project。
        accent: {type: string, pattern: '^$|^#[0-9A-Fa-f]{6}$', description: 空字符串或省略时使用配色默认强调色}
        background: {type: string, pattern: '^$|^#[0-9A-Fa-f]{6}$', description: 空字符串或省略时使用配色默认背景色}
        control: {type: string, pattern: '^$|^#[0-9A-Fa-f]{6}$', description: 空字符串或省略时使用配色默认控件色；独立于背景色和强调色}
    UserPreferences:
      type: object
      additionalProperties: false
      required: [user_id, locale, locale_explicit, theme, allow_write, appearance, version]
      properties:
        user_id: {type: string}
        locale: {type: string, enum: [zh-CN, zh-TW, en-US, ja-JP, de-DE, fr-FR, es-ES, pt-BR, ru-RU]}
        locale_explicit: {type: boolean, description: 是否由用户主动选择；false 时客户端跟随操作系统语言}
        theme: {type: string, enum: [system, light, dark]}
        allow_write: {type: boolean}
        appearance: {$ref: "#/components/schemas/Appearance"}
        version: {type: integer, format: int64, minimum: 1}
    UpdateUserPreferencesRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        locale: {type: string, enum: [zh-CN, zh-TW, en-US, ja-JP, de-DE, fr-FR, es-ES, pt-BR, ru-RU]}
        theme: {type: string, enum: [system, light, dark]}
        allow_write: {type: boolean}
        appearance:
          allOf:
            - {$ref: "#/components/schemas/Appearance"}
          description: 整对象替换（不合并颜色字段）；省略时保留已保存外观。与其他设置共用 expected_version 并原子提交。

    Inspiration:
      type: object
      additionalProperties: false
      required: [id, version, created_at, updated_at, project_id, title, markdown, completed, completed_at]
      properties:
        id: {type: string}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        project_id: {type: string}
        title: {type: string}
        markdown: {type: string, description: 唯一正文格式；Markdown 字符串，不是 HTML 或编辑器 JSON}
        completed: {type: boolean}
        completed_at: {type: [string, 'null'], format: date-time}
    InspirationQuery:
      type: object
      additionalProperties: false
      properties:
        project_id: {type: string}
        search: {type: string, maxLength: 500}
        status: {type: string, enum: [all, open, completed]}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        limit: {type: integer, minimum: 0, maximum: 100}
    WorkLocation:
      type: object
      additionalProperties: false
      properties:
        project_id: {type: string, maxLength: 128}
        issue_id: {type: string, maxLength: 128}
        graph_id: {type: string, maxLength: 128}
        node_id: {type: string, maxLength: 128}
    WorkCondition:
      type: object
      additionalProperties: false
      description: 条件组只使用 join 和 conditions；单个条件使用 field/operator/value。不得混合两种结构。值为空可匹配空字段，所有值均以 SQL 参数绑定。
      properties:
        join: {type: string, enum: [and, or]}
        conditions: {type: array, maxItems: 60, items: {$ref: '#/components/schemas/WorkCondition'}}
        field: {type: string, description: 服务端白名单字段，不接受 SQL 表达式}
        operator: {type: string, enum: [eq, ne, contains, not_contains]}
        value: {type: string, maxLength: 500}
    WorkQuery:
      type: object
      additionalProperties: false
      properties:
        search: {type: string, maxLength: 500}
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        filter: {$ref: '#/components/schemas/WorkCondition'}
        include_changes: {type: boolean, default: false}
        offset: {type: integer, minimum: 0, maximum: 1000000}
        limit: {type: integer, minimum: 0, maximum: 200, default: 50}
    WorkRecord:
      type: object
      description: 不存正文、提示词、认证凭据或任意请求快照；正常名称、路径和标识不打码。before/after/refs 为字段白名单元数据。对象删除不会级联删除记录。
      properties:
        id: {type: string}
        kind: {type: string, enum: [operation, change, navigation]}
        action: {type: string}
        actor_type: {type: string}
        actor_id: {type: string}
        object_type: {type: string}
        object_id: {type: string}
        object_version: {type: integer}
        title: {type: string}
        project_id: {type: string}
        run_id: {type: string}
        parent_id: {type: string}
        request_id: {type: string}
        client_id: {type: string}
        page_id: {type: string}
        entry_type: {type: string}
        sequence: {type: integer}
        outcome: {type: string}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        finished_at: {type: string}
        refs: {type: object, additionalProperties: true}
        before: {type: object, additionalProperties: true}
        after: {type: object, additionalProperties: true}
        error_code: {type: string}
    UpdateNetworkAccessRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        password: {type: string, format: password, writeOnly: true, maxLength: 72, description: 空或省略时保留；非空至少 8 字符，最多 72 UTF-8 字节，无控制字符}

    NetworkAccess:
      type: object
      additionalProperties: false
      required: [external_access, external_urls, port, password_set, can_manage, listen_error]
      properties:
        external_access: {type: boolean, description: 当前实际是否监听外部地址}
        external_urls: {type: array, items: {type: string, format: uri}}
        port: {type: integer, minimum: 0, maximum: 65535, readOnly: true, description: 本机与局域网共用的唯一服务端口号，启动时选择，不能通过此设置修改}
        password_set: {type: boolean}
        can_manage: {type: boolean, description: 仅本机入口为 true}
        listen_error: {type: boolean, description: 重启时端口冲突等导致监听失败；本机仍可用}

    FeatureTourID:
