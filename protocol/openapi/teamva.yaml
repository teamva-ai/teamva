      properties:
        key: {type: string}
        agent_id: {type: string}
        title: {type: string}
        instruction: {type: string}
        after: {type: array, items: {type: string}}
        status: {type: string, description: waiting_dependencies/blocked 或对应 Run 状态，客户端须保留未知状态兜底}
