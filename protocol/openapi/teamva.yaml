      properties:
        id: {type: string, description: 当前 Git 快照内的不透明变更 ID}
        path_id: {type: string}
        area: {type: string, enum: [conflict, staged, unstaged, untracked]}
        status: {type: string}
        kind: {type: string}
        path: {$ref: "#/components/schemas/GitDisplayPath"}
        old_path:
