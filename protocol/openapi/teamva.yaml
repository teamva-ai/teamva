      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        agent_service_id: {type: string, description: 可选，变更到同一电脑的 Coding Agent 服务并生成新修订}
        name: {type: string}
        note: {type: string}
        status: {type: string, enum: [active, disabled]}
        model: {type: string, maxLength: 500}
        system_prompt: {type: string}
        skill_version_ids: {type: array, items: {type: string}}
    CreateIssueRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: 任务标题，可为空；空标题在界面上显示为「未命名任务」。
        description: {type: string, description: 可在创建时填写，创建后只读}
        status: {type: string, enum: [open, resolved, closed]}
        worktree_hint:
          type: boolean
          default: false
          description: 勾选后向 Agent 注入「必要时创建 Git Worktree 并汇报路径」提示；平台不创建 worktree。
    UpdateIssueRequest:
      type: object
      additionalProperties: false
      description: 仅更新标题、状态和 worktree 提示；description 创建后只读，传入该字段（包括 null）会拒绝整个请求。
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        title: {type: string}
        status: {type: string, enum: [open, resolved, closed]}
        worktree_hint: {type: boolean}
    CreateIssueCommentRequest:
      type: object
      additionalProperties: false
      description: 仅创建当前用户的评论；不接受 Agent 作者或 Run 字段。Agent 公共总结必须通过当前有效 Run 的 ToolService 发布。普通评论 body 必填非空；work_items 非空时可省略正文。
      oneOf:
