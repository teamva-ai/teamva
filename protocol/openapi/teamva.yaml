        mention_id: {type: string}
        run_id: {type: string}
        issue_agent_instance_id: {type: string}
        result_comment_id: {type: string}
        blocked_by: {type: array, items: {type: string}}
    IssueComment:
      type: object
      required: [id, version, issue_id, author_kind, body, status]
      properties:
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        issue_id: {type: string}
        author_kind: {type: string, enum: [user, agent]}
        author_user_id: {type: string}
        author_agent_id: {type: string}
        body: {type: string}
        run_id: {type: string}
        status: {type: string, enum: [working, published, failed]}
        edited_at: {type: string, format: date-time}
        work_items: {type: array, items: {$ref: "#/components/schemas/IssueWorkItem"}}
    UpdateIssueCommentRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        body: {type: string}
    CreateIssueRunRequest:
      type: object
      additionalProperties: false
      required: [issue_agent_instance_id, expected_issue_version]
      properties:
        issue_agent_instance_id:
          type: string
          description: 续接当前打开的 Agent 会话
        input: {type: string, description: sidesheet 追问或补充指令；服务端会拼入 Issue 上下文}
        attachments:
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/ImageContentBlock"}
          description: 仅接受公开 image 内容块；单张解码后不超过 512 KiB，总计不超过 768 KiB；持续目标和内部操作不支持附件
        intent:
          type: string
          enum: [message, revise_comment]
          default: message
          description: revise_comment 会定位当前会话最近的已发布评论并生成精确的内部修正指令
        internal:
          type: boolean
          default: false
          description: 内部控制消息；发送给 Provider，但不作为用户消息展示在会话侧栏
        goal:
          type: boolean
          default: false
          description: 将本次非空消息作为持续目标；每轮由独立只读审核 Run 决定继续、完成或阻塞
        goal_token_budget:
          type: integer
          format: int64
          minimum: 1000
          maximum: 100000000
          description: 可选的工作 Agent Token 预算；仅可与 goal=true 一起使用，审核 Run 不计入预算
        expected_issue_version: {type: integer, format: int64, minimum: 1}
    StopRunRequest:
      type: object
      additionalProperties: false
      description: 只支持显式 mode，不提供超时后自动升级停止方式的选项。
      required: [mode]
      properties:
        mode: {type: string, enum: [graceful, force]}
    CreateMemoryRequest:
      type: object
      additionalProperties: false
      description: 省略或留空标题时使用新记忆，并在首份正文持久化后异步由 Lumi 命名；显式标题作为用户标题保留。
      required: [key, kind, content]
      properties:
        key: {type: string}
        kind: {type: string}
        title: {type: string}
        content: {type: string}
        source_type: {type: string}
        source_ref: {type: string}
    UpdateMemoryRequest:
      type: object
      additionalProperties: false
      description: 省略 title 保留当前标题；显式携带 title（包括同值）撤销自动命名写入权。正文版本与标题变更均保留真实版本历史。
      required: [expected_version, content]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        title: {type: string}
        content: {type: string}
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, action_digest, decision]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        action_digest: {type: string}
        decision: {type: string, enum: [approved, denied]}
        scope:
          type: string
          enum: [once, session]
          default: once
          description: session 仅传递给当前 Provider 原生会话；项目级长期授权必须通过策略规则显式创建。
    PolicyRuleRequest:
      type: object
      additionalProperties: false
      required: [action_kind, effect, conditions]
      properties:
        action_kind: {type: string}
        effect: {type: string, enum: [allow, deny, require_approval]}
        conditions: {type: object, additionalProperties: true}
        expires_at: {type: [string, "null"], format: date-time}
    UpdatePolicyRuleRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, format: int64, minimum: 1}
        effect: {type: string, enum: [allow, deny, require_approval]}
        conditions: {type: object, additionalProperties: true}
        expires_at:
          type: [string, "null"]
          format: date-time
          description: "省略保留原到期时间；null 清除到期时间；RFC3339 时间按 UTC 持久化并保留纳秒精度。"
        enabled: {type: boolean}
    ScheduleTimes:
      type: array
      minItems: 1
      maxItems: 64
      description: "daily/weekly 必填。本地 HH:mm 时分对；服务端去重排序，不展开时分笛卡尔积"
      items: {type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'}
    ScheduleWeekdays:
      type: array
      minItems: 1
      maxItems: 7
      description: "weekly 必填，0 为星期日、6 为星期六；服务端去重排序"
      items: {type: integer, minimum: 0, maximum: 6}
    ScheduledTaskRequest:
      type: object
      additionalProperties: false
      description: "新建默认 issue_mode=new；existing 必须提供 issue_id，new 禁止携带 issue_id。省略或留空 name 使用新定时任务，并按首份提示词异步由 Lumi 命名；显式名称保留。提示词不能全空白。Agent 必须是本项目电脑已启用且有有效 revision 的 Agent；配置后的 Lumi 同样可以参与定时 Issue。"
      required: [schedule_kind, timezone, prompt, agent_id]
      properties:
        name: {type: string}
        schedule_kind: {type: string, enum: [daily, weekly, once, cron]}
        schedule_expression: {type: string, description: "once 必填 RFC3339；cron 必填五字段表达式；daily/weekly 不需要"}
        times: {$ref: "#/components/schemas/ScheduleTimes"}
        weekdays: {$ref: "#/components/schemas/ScheduleWeekdays"}
        issue_mode: {type: string, enum: [new, existing], default: new}
        issue_id: {type: string}
        timezone: {type: string, examples: [Asia/Shanghai]}
        prompt: {type: array, minItems: 1, items: {$ref: "#/components/schemas/TextContentBlock"}}
        agent_id: {type: string}
        concurrency_policy: {type: string, enum: [forbid, allow]}
        misfire_policy: {type: string, enum: [skip, run_once]}
    UpdateScheduledTaskRequest:
      type: object
      additionalProperties: false
      description: "省略 issue_mode 时保留原模式/目标，包括旧 standalone 兼容模式；暂停/恢复仅改变 enabled，不丢失扩展配置。省略 name 保留当前名称；显式 name（包括同值）作为用户改名撤销自动命名写入权。"
      required: [schedule_kind, timezone, prompt, expected_version]
      properties:
        name: {type: string}
        schedule_kind: {type: string, enum: [daily, weekly, once, cron]}
        schedule_expression: {type: string, description: "once 必填 RFC3339；cron 必填五字段；daily/weekly 不需要"}
        times: {$ref: "#/components/schemas/ScheduleTimes"}
        weekdays: {$ref: "#/components/schemas/ScheduleWeekdays"}
        issue_mode: {type: string, enum: [new, existing]}
        issue_id: {type: string}
        timezone: {type: string}
        prompt: {type: array, minItems: 1, items: {$ref: "#/components/schemas/TextContentBlock"}}
        agent_id: {type: string}
        concurrency_policy: {type: string, enum: [forbid, allow]}
        misfire_policy: {type: string, enum: [skip, run_once]}
        expected_version: {type: integer, format: int64, minimum: 1}
    SchedulePreviewRequest:
      type: object
      additionalProperties: false
      required: [schedule_kind, timezone]
      properties:
        schedule_kind: {type: string, enum: [daily, weekly, once, cron]}
        schedule_expression: {type: string, description: "once 必填 RFC3339 绝对时刻（预览不改变它）；cron 必填五字段；daily/weekly 不需要"}
        times: {$ref: "#/components/schemas/ScheduleTimes"}
        weekdays: {$ref: "#/components/schemas/ScheduleWeekdays"}
        timezone: {type: string}
        count: {type: integer, minimum: 1, maximum: 20, default: 5}
