      content:
        application/json:
          schema: {$ref: "#/components/schemas/GitDiffResultEnvelope"}
    GitRunChangesResult:
      description: Run Git 历史读取成功
      headers:
        Cache-Control: {$ref: "#/components/headers/NoStore"}
