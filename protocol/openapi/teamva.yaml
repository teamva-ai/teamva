                next_cursor: {type: string}
    ScheduledTask:
      type: object
      additionalProperties: false
      description: |
        陈旧 cron occurrence 处理一次后从当前时间计算下一次，不逐分钟补跑；同一 task 每个
        scheduler tick 最多 catch-up 一次。dispatch 失败持久化指数退避，永久配置错误会暂停任务。
        新建 HTTP 任务默认 issue_mode=new，每次原子创建 Issue、用户提示评论、结构化 mention 与队列 Run；
        existing 仅复用本项目 open Issue，已结束、删除或有暂停会话时拒绝并暂停自动调度，不自动重开。
        旧数据库中无配置 profile 的任务省略 issue_mode，保留原 standalone Run 行为；编辑可显式选择新模式。
        扩展配置与核心记录同事务写入 app_metadata，不修改数据库基线；配置缺失或损坏时拒绝执行。
        daily/weekly 按 IANA 本地时分对计算，DST 缺失分钟跳过、重复分钟各触发一次，预览与执行共用算法。
      required: [id, version, created_at, updated_at, project_id, name, enabled, schedule_kind, schedule_expression, timezone, prompt, concurrency_policy, misfire_policy, dispatch_attempts]
      properties:
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        project_id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        schedule_kind: {type: string, enum: [daily, weekly, once, cron]}
        schedule_expression: {type: string, description: "once 使用 RFC3339 绝对时间；cron 使用五字段；daily/weekly 返回空字符串"}
        times: {$ref: "#/components/schemas/ScheduleTimes"}
        weekdays: {$ref: "#/components/schemas/ScheduleWeekdays"}
        issue_mode: {type: string, enum: [new, existing]}
        issue_id: {type: string, description: "existing 模式的本项目目标 Issue"}
        timezone: {type: string}
        prompt: {type: array, items: {$ref: "#/components/schemas/TextContentBlock"}}
        agent_id: {type: string}
        concurrency_policy: {type: string, enum: [forbid, allow]}
        misfire_policy: {type: string, enum: [skip, run_once]}
        next_run_at: {type: string, format: date-time}
        dispatch_attempts: {type: integer, minimum: 0}
        dispatch_retry_at: {type: string, format: date-time}
        last_dispatch_error: {type: string, maxLength: 128, description: 有界错误代码，不包含 Provider 输出、路径或凭据}
    ScheduledTaskRun:
      type: object
      additionalProperties: false
      description: "触发记录、Issue/用户评论/mention、queued Run 在同一事务提交；相同触发键只产生一次副作用；Issue 模式通过 issue_id 链接真实运行任务"
      required: [id, scheduled_task_id, trigger_key, scheduled_for, status, created_at, dispatch_attempts]
      properties:
        id: {type: string}
        scheduled_task_id: {type: string}
        run_id: {type: string}
        issue_id: {type: string, description: "Run 关联 Issue；旧 standalone 与跳过记录不提供"}
        trigger_key: {type: string}
        scheduled_for: {type: string, format: date-time}
        status: {type: string, enum: [pending, running, succeeded, failed, cancelled, lost, skipped_misfire, skipped_concurrency]}
        created_at: {type: string, format: date-time}
        dispatch_attempts: {type: integer, minimum: 0}
        retry_at: {type: string, format: date-time}
        last_error: {type: string, maxLength: 128, description: occurrence 的有界 dispatch 错误代码}
    ScheduledTaskEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ScheduledTask"}
    ScheduledTaskPageEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: "#/components/schemas/ScheduledTask"}}
                next_cursor: {type: string}
    ScheduledTaskRunEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ScheduledTaskRun"}
    ScheduledTaskRunPageEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: "#/components/schemas/ScheduledTaskRun"}}
                next_cursor: {type: string}
    RunEvent:
      type: object
      additionalProperties: false
      description: 紧凑 JSON wire 完整编码后硬上限 8 MiB；payload 紧凑编码上限为 8 MiB 减 64 KiB。HTTP 列表与 SSE 对内部 user.steer 和原生用户输入回显仅保留 internal=true 元数据，不返回正文，原事件身份和 seq 不变以支持分页与重放；持久化事件不变。
      required: [id, run_id, seq, event_type, payload, occurred_at]
      properties:
        id: {type: string}
        run_id: {type: string}
        seq: {type: integer, format: int64, minimum: 1}
        event_type: {type: string}
        payload: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
    RunEventPageEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data:
              type: object
              required: [items, truncated]
              properties:
                items: {type: array, items: {$ref: "#/components/schemas/RunEvent"}}
                next_cursor: {type: string, description: 最后一个已返回事件的十进制 seq}
                truncated: {type: boolean, description: 达到条数或累计紧凑 payload wire 字节预算时为 true}
    GitRepositoryWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: UI 本地化必须使用的稳定代码
          enum:
            - discovery_limit_exceeded
            - status_unavailable
            - watch_limit_exceeded
            - stats_unavailable
            - status_output_truncated
            - changes_truncated
            - status_truncated
            - path_limit_exceeded
            - patch_truncated
            - snapshot_payload_truncated
            - snapshot_incomplete
            - snapshot_capture_failed
            - snapshot_save_failed
        message:
          type: string
          description: 不含本机路径的安全英文 fallback；UI 不应将其作为本地化主键
    GitRepositoryBranch:
      type: object
