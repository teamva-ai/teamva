        agent_id: {type: string, minLength: 1}
        title: {type: string, minLength: 1, maxLength: 120}
        instruction: {type: string, description: 可选具体要求，UTF-8 字节上限 16 KiB}
        after: {type: array, maxItems: 31, uniqueItems: true, items: {type: string}, description: 本批次工作 key，不可引用自身、缺失工作或形成等待环}
    IssueWorkItem:
      type: object
