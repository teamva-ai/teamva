    RunPage:
      description: 运行列表读取成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/RunPageEnvelope"}
    GitRepositoryList:
      description: Git 仓库发现成功
      headers:
        Cache-Control: {$ref: "#/components/headers/NoStore"}
        X-Content-Type-Options: {$ref: "#/components/headers/NoSniff"}
