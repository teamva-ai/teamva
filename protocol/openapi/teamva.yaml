      content:
        application/json:
          schema: {$ref: "#/components/schemas/GitRunChangesEnvelope"}
    ScheduledTask:
      description: 计划任务读取或写入成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ScheduledTaskEnvelope"}
    ScheduledTaskPage:
      description: 计划任务列表读取成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ScheduledTaskPageEnvelope"}
    ScheduledTaskRun:
      description: 计划任务触发成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ScheduledTaskRunEnvelope"}
    ScheduledTaskRunPage:
      description: 计划任务触发历史读取成功
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ScheduledTaskRunPageEnvelope"}
  schemas:
    MCPTarget:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: {type: string, enum: [user, project]}
        project_id: {type: string, minLength: 1, maxLength: 256}
        version: {type: integer, format: int64, minimum: 1, description: 可选的页面快照版本；连接与授权始终操作当前保存配置，不修改配置版本}
      description: user 禁止 project_id；project 必须提供当前用户拥有的项目 ID，不能以名称推断所有权
      oneOf:
        - properties:
            scope: {const: user}
          not: {required: [project_id], properties: {project_id: {}}}
        - required: [project_id]
          properties:
            scope: {const: project}
            project_id: {type: string}
    MCPServerInput:
      type: object
      additionalProperties: false
      required: [name, scope, version, config]
      properties:
        name: {type: string, pattern: '^[a-z0-9](?:[a-z0-9_-]{0,126}[a-z0-9])?$'}
        scope: {type: string, enum: [user, project]}
        project_id: {type: string, minLength: 1, maxLength: 256}
        version: {type: integer, format: int64, minimum: 0, description: 0 创建；正整数为旧 View 的乐观版本。新条目使用随机版本种子，后续每次保存严格递增}
        config: {$ref: "#/components/schemas/MCPConfig"}
      oneOf:
        - properties:
            scope: {const: user}
          not: {required: [project_id], properties: {project_id: {}}}
        - required: [project_id]
          properties:
            scope: {const: project}
            project_id: {type: string}
    MCPSecretValue:
      type: string
      maxLength: 65536
      description: |
        私有值只进入本机 MCP 私有文件；响应固定为 __TEAMVA_KEEP_SECRET__。
        提交该哨兵仅保留相同条目/字段的旧秘密，不代表清空或新的真实值；没有旧值时拒绝。
      examples: [__TEAMVA_KEEP_SECRET__]
    MCPTimeout:
      type: object
      additionalProperties: false
      description: V2 启动、目录读取和工具执行超时，单位毫秒；各项可省略使用运行时默认值
      properties:
        startup: {type: integer, minimum: 1, maximum: 3600000}
        catalog: {type: integer, minimum: 1, maximum: 3600000}
        execution: {type: integer, minimum: 1, maximum: 3600000}
    MCPOAuth:
      oneOf:
        - {type: boolean, const: false}
        - type: object
          additionalProperties: false
          properties:
            client_id: {type: string}
            client_secret: {$ref: "#/components/schemas/MCPSecretValue"}
            scope: {type: string}
            redirect_uri: {type: string, format: uri, description: 仅 http://127.0.0.1 的本机回调 URL，不含 query 或 fragment}
            auth_server_metadata_url: {type: string, format: uri}
            callback_port: {type: integer, minimum: 1, maximum: 65535}
      description: false 显式禁用 OAuth；对象使用 V2 snake_case 字段，省略时按协议发现默认授权能力。本页管理器仅使用随机 loopback 临时回调，固定 callback_port/redirect_uri 仅保存并透传支持该字段的原生 Provider
    MCPConfig:
      description: |
        完整 OpenCode V2 MCP entry 对象。local command 是 argv 数组，不是 shell 字符串；
        认证秘密放 environment/headers/oauth.client_secret，不得放 command、cwd、URL、目录描述或日志。
        所有 environment/headers 值（不限于看起来像密钥的名称）均视为敏感值并在 View 中替换为保留哨兵。
        不接受额外 Provider 字段、camelCase OAuth 字段、用户名密码 URL 或携带认证秘密的 URL 查询参数。
      oneOf:
        - {$ref: "#/components/schemas/MCPLocalConfig"}
        - {$ref: "#/components/schemas/MCPRemoteConfig"}
    MCPLocalConfig:
      type: object
      additionalProperties: false
      required: [type, command]
      properties:
        type: {type: string, const: local}
        command: {type: array, minItems: 1, maxItems: 256, items: {type: string, maxLength: 8192}, description: 显式 argv；保存不执行，不允许在命令行参数携带秘密}
        cwd: {type: string, description: 可选的绝对工作目录}
        environment:
          type: object
          maxProperties: 256
          propertyNames: {pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
          additionalProperties: {$ref: "#/components/schemas/MCPSecretValue"}
        disabled: {type: boolean, default: false}
        protocol: {type: string, enum: [legacy, auto, "2026-07-28"]}
        codemode: {type: boolean}
        timeout: {$ref: "#/components/schemas/MCPTimeout"}
    MCPRemoteConfig:
      type: object
      additionalProperties: false
      required: [type, url]
      properties:
        type: {type: string, const: remote}
        url: {type: string, format: uri, description: HTTP(S) MCP 端点；禁止 userinfo、fragment 和认证秘密查询参数}
        environment:
          type: object
          maxProperties: 256
          propertyNames: {pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
          additionalProperties: {$ref: "#/components/schemas/MCPSecretValue"}
        headers:
          type: object
          maxProperties: 256
          additionalProperties: {$ref: "#/components/schemas/MCPSecretValue"}
          description: 所有 header 值均脱敏；禁止覆盖 Host、Cookie、Set-Cookie、Content-Length、Transfer-Encoding 和 Connection
        oauth: {$ref: "#/components/schemas/MCPOAuth"}
        disabled: {type: boolean, default: false}
        protocol: {type: string, enum: [legacy, auto, "2026-07-28"]}
        codemode: {type: boolean}
        timeout: {$ref: "#/components/schemas/MCPTimeout"}
    MCPServerView:
      type: object
      required: [name, scope, version, config, status]
      properties:
        name: {type: string}
        scope: {type: string, enum: [user, project]}
        project_id: {type: string, description: 仅项目级条目包含此字段}
        version: {type: integer, format: int64, minimum: 1}
        config: {$ref: "#/components/schemas/MCPConfig"}
        status: {type: string, enum: [disconnected, disabled, connecting, connected, error, needs_auth, auth_pending, unsupported], description: 当前显式连接/授权状态；保存或重启不自动连接}
        shadowed: {type: boolean, description: 个人条目已被当前项目的同名配置覆盖（包括项目禁用条目）}
        error: {type: string, description: 可选稳定错误码，不包含原始子进程输出、URL 凭据或上游正文}
        authenticated: {type: boolean}
        protocol_version: {type: string}
        tools: {type: array, items: {type: object, additionalProperties: true}, description: MCP tools/list 目录，不在此 API 中执行工具}
        resources: {type: array, items: {type: object, additionalProperties: true}}
        resource_templates: {type: array, items: {type: object, additionalProperties: true}}
        prompts: {type: array, items: {type: object, additionalProperties: true}}
    MCPAuthResult:
      type: object
      required: [authorization_url, status]
      properties:
        authorization_url: {type: string, format: uri, description: 仅用于显式打开授权页面，不包含客户端密钥或访问/刷新 token，不写日志}
        status: {type: string}
    ResourceOpener:
      type: object
      required: [id, kind, name, available]
      properties:
        id: {type: string}
        kind: {type: string, enum: [file_manager, terminal, ide]}
        name: {type: string}
        available: {type: boolean}
    ResourceOpeners:
      type: object
      required: [platform, items]
      properties:
        platform: {type: string, enum: [darwin, windows, linux]}
        items: {type: array, items: {$ref: "#/components/schemas/ResourceOpener"}}
    DiagnosticStep:
      type: object
      required: [id, label, status, message]
      properties:
        id: {type: string}
        label: {type: string}
        status: {type: string, enum: [success, failed, warning, skipped]}
        message: {type: string}
        detail: {type: string}
        duration_ms: {type: integer, format: int64, minimum: 0}
    ProviderDiagnostic:
      type: object
      required: [provider, available, authenticated, status, capability_version, started_at, finished_at, steps]
      properties:
        provider: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
        provider_version: {type: string}
        available: {type: boolean}
        authenticated: {type: boolean}
        status: {type: string, enum: [connected, needs_auth, unavailable]}
        unavailable_reason_code: {type: string}
        capabilities: {type: object, additionalProperties: true}
        capability_version: {type: integer}
        models: {type: array, items: {type: string}}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        steps: {type: array, items: {$ref: "#/components/schemas/DiagnosticStep"}}
    ProviderRuntimeRecycleResult:
      type: object
      additionalProperties: false
      required: [provider, recycled_instances, active_instances, remaining_instances]
      properties:
        provider: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
        recycled_instances: {type: integer, minimum: 0}
        active_instances: {type: integer, minimum: 0}
        remaining_instances: {type: integer, minimum: 0}
    ModelProviderInput:
      type: object
      additionalProperties: false
      required: [preset_id, base_url, model]
      properties:
        preset_id: {type: string, enum: [openai, anthropic, google, deepseek, dashscope, moonshot, zhipu, openrouter, custom]}
        base_url: {type: string, maxLength: 2048, description: HTTPS API 根地址，或本机 loopback HTTP；不允许用户名、密码、查询参数或 fragment}
        model: {type: string, minLength: 1, maxLength: 200}
        api_key: {type: string, maxLength: 8192, writeOnly: true, description: 不回显；留空仅保留同供应商同完整端点的既有密钥}
    ModelProviderView:
      type: object
      required: [preset_id, name, base_url, model, model_ref, key_configured]
      properties:
        preset_id: {type: string}
        name: {type: string}
        base_url: {type: string}
        model: {type: string}
        model_ref: {type: string, description: 供 Lumi/OpenCode 使用的完整 provider/model 引用}
        key_configured: {type: boolean}
    ProgrammingToolExecutable:
      type: object
      additionalProperties: false
      required: [provider, path, resolved, source]
      properties:
        provider: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
        path: {type: string, description: 用户保存的自定义可执行文件路径；空表示自动解析}
        resolved: {type: string, description: 运行时当前实际使用的可执行文件路径或命令名}
        source: {type: string, enum: [custom, environment, bundled, path], description: 解析来源：设置路径、环境变量、应用内置运行时或 PATH}
    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        resource_version: {type: integer, format: int64, minimum: 1}
        replayed: {type: boolean, default: false}
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    Page:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: string}
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string, examples: [version_conflict]}
            message:
              type: string
              description: 至少包含英文；含中文业务说明时使用 `English / 中文` 双语格式
              examples: ["The resource version has changed / 资源版本已变化"]
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
        meta: {$ref: "#/components/schemas/ResponseMeta"}
    ImageContentBlock:
      type: object
      additionalProperties: false
      required: [type, mime_type, filename, data_url]
      properties:
        type: {type: string, const: image}
        mime_type: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp]}
        filename: {type: string, minLength: 1, maxLength: 255}
        data_url:
          type: string
          pattern: '^data:image/(png|jpeg|gif|webp);base64,'
          maxLength: 699100
          writeOnly: true
          description: 仅创建 Run 或 steer 时接受；Run 与事件响应不会返回原始图片数据
    PublicContentBlock:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, text]
          properties:
            type: {type: string, const: text}
            text: {type: string}
            internal: {type: boolean, default: false}
        - type: object
          additionalProperties: false
          required: [type, mime_type, filename]
          properties:
            type: {type: string, const: image}
            mime_type: {type: string, enum: [image/png, image/jpeg, image/gif, image/webp]}
            filename: {type: string, minLength: 1, maxLength: 255}
    TextContentBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {type: string, const: text}
        text: {type: string}
        internal: {type: boolean, default: false}

    Project:
      type: object
      additionalProperties: false
      required: [id, version, created_at, updated_at, computer_id, name, is_default]
      properties:
        id: {type: string}
        version: {type: integer, format: int64, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        computer_id: {type: string}
        name: {type: string}
        description: {type: string}
        is_default:
          type: boolean
          readOnly: true
          description: 是否为本机唯一内置默认项目。名称固定为“默认项目”，不可删除；按稳定 ID 而非名称识别。该项目使用真实非空 ID，支持普通项目业务。

    ProjectEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data: {$ref: "#/components/schemas/Project"}
    ProjectPageEnvelope:
      allOf:
        - {$ref: "#/components/schemas/SuccessEnvelope"}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: "#/components/schemas/Project"}}
                next_cursor: {type: string}
    ProjectSearchResult:
      type: object
      additionalProperties: false
      required: [id, kind, project_id, title, excerpt, occurred_at]
      properties:
        id: {type: string}
