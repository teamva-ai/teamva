          properties:
            body: {type: string, minLength: 1, pattern: '\S'}
            work_items: {type: array, maxItems: 0}
        - required: [work_items]
          properties:
            work_items: {type: array, minItems: 1}
            mentioned_agent_ids: {type: array, maxItems: 0}
      properties:
        body: {type: string}
        author_kind: {type: string, enum: [user], default: user, description: 可省略；作者始终绑定当前已登录用户，不允许 Agent 作者}
        mentioned_agent_ids:
          type: array
