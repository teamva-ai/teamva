<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teamva</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fbfbfb; color: #09090b; }
      main { display: grid; justify-items: center; gap: 14px; padding: 32px; text-align: center; }
      .mark { display: block; width: 44px; height: 44px; }
      .spinner { width: 18px; height: 18px; border: 2px solid #e4e4e7; border-top-color: #18181b; border-radius: 50%; animation: spin .8s linear infinite; }
      #error { display: none; max-width: 560px; color: #a42a2a; line-height: 1.5; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        body { background: #111114; color: #fafafa; }
        .spinner { border-color: #3b3b3d; border-top-color: #fafafa; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="brand-icon.png" alt="" />
      <strong>正在启动 Teamva…</strong>
      <div class="spinner" id="spinner" aria-label="正在启动"></div>
      <p id="error" role="alert"></p>
    </main>
    <script>
      window.showStartupError = function (message) {
        document.getElementById("spinner").style.display = "none";
        const error = document.getElementById("error");
        error.textContent = message;
        error.style.display = "block";
      };
    </script>
  </body>
</html>
